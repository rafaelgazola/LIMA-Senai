<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição curso</title>
</head>
<body>
    <h1>Formulario de inscrição</h1>

    <form>
        <label for="nome">Nome:</label> <!--nome para inscricao-->
        <input type="text" id="nome" name="nome">
        <br><br>
        
        <label for="email">Email:</label> <!-- lebel de email-->
        <input type="email" id="email" name="email"> <!-- input especifico para email-->
        <br><br>

        <label for="telefone">Telefone:</label> <!-- label para telefone-->
        <input type="tel" id="telefone" name="telefone"> <!-- especifico para telefone-->
        <br><br>

        <label for="nascimento">Data de Nascimento:</label> <!-- label para data-->
        <input type="date" id="nascimento" name="nascimento"> <!-- especifico para date-->
        <br><br>

        <label for="obs">Observações:</label> <!-- label para observações-->
        <textarea name="obs" id="obs"></textarea> <!-- especifico para obs-->
        <br><br>

        <button type="submit">Enviar Inscrição</button> <!-- para enviar-->

    </form> 
</body>
</html>
