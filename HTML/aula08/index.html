<!-- Exemplo de Formulario e Fieldset para Aprendizado -->
    <h2>Revisao de Formularios</h2>

    <form> <!-- Caixao principal do formulario -->
        
        <fieldset> <!-- Caixa visual que agrupa os campos -->
            <legend>Informacoes de Acesso</legend> <!-- Titulo da caixa do fieldset -->

            <label for="usuario">Usuario:</label> <!-- Texto ligado ao campo -->
            <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuario"> <!-- Campo de texto -->
            <br><br>

            <label for="senha">Senha:</label> <!-- Label da senha -->
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha"> <!-- Input do tipo senha (esconde o texto) -->
            <br><br>

            <label for="recado">Mensagem:</label><br> <!-- Label do campo grande -->
            <textarea id="recado" name="recado" placeholder="Deixe uma mensagem..."></textarea> <!-- Caixa de texto de varias linhas -->
        </fieldset>

        <br>
        <button type="submit">Entrar</button> <!-- Botao de envio -->

    </form>
