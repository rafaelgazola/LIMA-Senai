<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Tabela HTML</title>
</head>
<body>
    <h1>TABELAS</h1>
    <table border="1">
        
        <!-- Linha de Cabeçalho Principal com mesclagem de colunas -->
        <tr>
            <th colspan="2">Cronograma de Estudos</th>
        </tr>
        
        <!-- Linha de Cabeçalhos Secundários -->
        <tr>
            <th>Dia da Semana</th>
            <th>Matéria</th>
        </tr>

        <!-- Linha com mesclagem de linhas para o dia -->
        <tr>
            <td rowspan="2">Segunda-feira</td>
            <td>HTML Básico</td>
        </tr>
        
        <!-- Linha normal (só precisa de 1 td, pois o da esquerda já desceu) -->
        <tr>
            <td>Tags de Tabela</td>
        </tr>

    </table>

</body>
</html>
