<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercicio 2</title>
    <style>
        .card {
            width: 100px;
            height: 100px;
            background: lightblue;
            margin: 20px;
            display: inline-block;
        }

        .card-1 {
            transform: scale(1.1);
        }

        .card-2 {
            transform: rotate(10deg);
        }

        .card-3 {
            transform: translateY(-10px);
        }
    </style>

</head>
<body>

    <h3>Atividade de Aplicação - Ex 02</h3>

    <div class="card card-1">Card 1</div>
    <div class="card card-2">Card 2</div>
    <div class="card card-3">Card 3</div>

    <h3>Análise das Diferenças Visuais:</h3>
    
    <p>Card 1 (scale(1.1)): Aumenta o tamanho do card em 10%.</p>
    <p>Card 2 (rotate(10deg)): Gira o card 10 graus no sentido horário.</p>
    <p>Card 3 (translateY(-10px)): Move o card 10 pixels para cima.</p>

</body>
</html>
