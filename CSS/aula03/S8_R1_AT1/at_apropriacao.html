<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Apropriação</title>
</head>

<body>
    <h3>Atividade de Apropriação - Ex 01</h3>

    <h3>Codigo:</h3>
    <p><code>transform: rotate(90deg);</code></p>

    <h3>1. Qual propriedade está sendo utilizada?</h3>
    <p>transform</p>

    <h3>2. Qual transformação sera aplicada?</h3>
    <p>Rotação de 90 graus no sentido horário</p>
</body>
